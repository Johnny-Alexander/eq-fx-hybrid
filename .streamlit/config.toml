[server]
# Default to listening on all interfaces so iPhone on same WiFi can connect.
# For local-only access, set this to "localhost".
address = "0.0.0.0"
port = 8501
headless = true

[browser]
# Don't try to auto-open a browser when launched (relevant on remote deploys)
gatherUsageStats = false

[theme]
# Slightly nicer defaults; Streamlit Cloud will use these too
base = "light"
primaryColor = "#1f77b4"
