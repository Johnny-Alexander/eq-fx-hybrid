<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EQ/FX Pricer" />
  <title>EQ/FX Hybrid Pricer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/stlite.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #root { height: 100vh; }
    .loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; font-family: -apple-system, sans-serif;
      background: #fff; z-index: 9999;
    }
    .loading h2 { color: #1f77b4; }
    .loading p { color: #666; max-width: 400px; text-align: center; padding: 0 20px; }
    .spinner {
      border: 3px solid #f3f3f3; border-top: 3px solid #1f77b4;
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* Sits above the stlite iframe so the surface page stays reachable while
       the pricer is still booting Pyodide. */
    .surface-link {
      position: fixed; top: 10px; right: 12px; z-index: 10000;
      font-family: -apple-system, sans-serif; font-size: 13px;
      background: #0d0d0d; color: #fff; text-decoration: none;
      padding: 7px 13px; border-radius: 6px; opacity: 0.9;
    }
    .surface-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <a class="surface-link" href="surface.html">3-D PnL surface →</a>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <h2>Loading pricer...</h2>
    <p>First load downloads Python + numpy + scipy (~50MB).
       Takes 30-60 seconds. Subsequent loads use the browser cache.</p>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/stlite.js";

    // Fetch the app source plus the pricer package, and mount them into
    // stlite's virtual filesystem under the same paths the repo uses, so
    // docs/app.py can share its imports with app/app.py verbatim.
    //
    // Keep this list in step with sync_docs.sh -- it is the one place the
    // package layout is spelled out twice.
    const modules = [
      "src/__init__.py",
      "src/hybrid_pricer.py",
      "src/hybrid/__init__.py",
      "src/hybrid/bivariate.py",
      "src/hybrid/cms.py",
      "src/hybrid/conditions.py",
      "src/hybrid/eqir.py",
      "src/hybrid/equity.py",
      "src/hybrid/greeks.py",
      "src/hybrid/products.py",
      "src/hybrid/surface.py",
    ];

    const [appPy, ...sources] = await Promise.all([
      fetch("./app.py").then(r => r.text()),
      ...modules.map(m => fetch("./" + m).then(r => r.text())),
    ]);

    const files = { "app.py": appPy };
    modules.forEach((m, i) => { files[m] = sources[i]; });

    mount(
      {
        requirements: ["numpy", "scipy", "matplotlib"],
        entrypoint: "app.py",
        files,
      },
      document.getElementById("root")
    );

    // Hide loading overlay once stlite renders something
    const observer = new MutationObserver(() => {
      const root = document.getElementById("root");
      if (root && root.children.length > 0 && root.querySelector("iframe, .stApp")) {
        document.getElementById("loading").style.display = "none";
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
